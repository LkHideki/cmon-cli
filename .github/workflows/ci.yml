name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-lint-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            duckdb: "duckdb==1.1.0"
          - python-version: "3.11"
            duckdb: "duckdb"
          - python-version: "3.12"
            duckdb: "duckdb"
          - python-version: "3.13"
            duckdb: "duckdb"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Select DuckDB compatibility target
        run: uv pip install --upgrade "${{ matrix.duckdb }}"
      - name: Pytest
        run: uv run --no-sync pytest
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Smoke (imports the module and validates CLI, no network)
        run: uv run --no-sync cmon --help
