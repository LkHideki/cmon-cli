name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run gets a group of its own,
# because a group keeps only one waiting run: pushes to main in quick succession would cancel all
# but the last.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-lint-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            duckdb: "duckdb==1.1.1"
          - python-version: "3.11"
            duckdb: "duckdb"
          - python-version: "3.12"
            duckdb: "duckdb"
          - python-version: "3.13"
            duckdb: "duckdb"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Select DuckDB compatibility target
        run: uv pip install --upgrade "${{ matrix.duckdb }}"
      - name: Pytest
        run: uv run --no-sync pytest
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Smoke (imports the module and validates CLI, no network)
        run: uv run --no-sync cmon --help

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test cmon Bar (Swift)
        run: menubar/test.sh
