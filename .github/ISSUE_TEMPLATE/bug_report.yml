name: Bug report
description: cmon or cmon Bar doesn't do what the README says it does
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a token. `cmon doctor` and `cmon token status` don't print it, but logs and
        output you copy by hand might. A security problem goes to a private report instead: see
        [SECURITY.md](https://github.com/LkHideki/cmon-cli/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact command, what you expected, and what you got instead.
      placeholder: |
        $ cmon burn --by project --plan
        Expected …, got …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, or the state that triggers it (a fresh install, cmon Bar open, a window at 100%…).
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cmon doctor --json --offline`
      description: It never shows the token. Drop `--offline` if the problem involves the usage API.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cmon version
      description: "`uv tool list | grep cmon-cli`, or `git rev-parse --short HEAD` if you run it from a clone"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - make install (macOS, with cmon Bar)
        - uv tool install
        - uv run from a clone
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: The text above has no token, and no path, project name or session id I want to keep private.
          required: true
